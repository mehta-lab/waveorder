  # --- Mantis v1 (neuromast, oblique label-free) ---
  # Mantis v2 shares this config structure but its deskewed intermediate
  # stores were deleted after assembly; add a cached deskewed crop later.

  mantis_v1_neuromast_phase_3d:
    type: hpc
    input: /hpc/projects/tlg2_mantis/2025_11_05_52hpf_cldnb-she-myo6b/0-convert/2025_11_05_52hpf_cldnb-she-myo6b_symlink/2025_11_05_52hpf_cldnb-she-myo6b_labelfree_1.zarr
    position: 0/1/000000
    config: ../configs/mantis_v1_neuromast_phase_3d.yml
    overrides:
