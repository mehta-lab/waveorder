    input: /hpc/projects/waveorder/cardiomyocytes-falcon/1-preprocessing/polarization-averaged-measurements.zarr
    position: 0/0/0
    config: ../configs/cardiomyocyte_phase_3d.yml

  zebrafish_daxi_phase_3d:
    type: hpc
    input: /hpc/projects/waveorder/zebrafish-daxi/1-rois/cropped_rois.zarr
    position: 0/0/eye
    config: ../configs/zebrafish_daxi_phase_3d.yml

  # --- Infected cells (EV71 iGluta neurons, 2025-07-17) ---

  ev71_phase_3d:
    type: hpc
    input: /hpc/projects/comp.micro/infected_cell_imaging/Neurons/2025_07_17_iGluta_EV71/0-convert/convert.zarr
    position: B/2/0
    config: ../configs/ev71_phase_3d.yml
    overrides:
