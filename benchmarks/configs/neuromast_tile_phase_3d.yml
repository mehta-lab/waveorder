# Tiled reconstruction (wo tile-stitch) of the neuromast oblique
# light-sheet phase case. The recon block matches
# neuromast_ls_phase_3d.yml except time_indices (tile-stitch runs one
# timepoint); the tile geometry splits YX into 384-px tiles with 64-px
# overlap and keeps the full 63-slice z depth per tile.
tile:
  tile_size: {z: 63, y: 384, x: 384}
  overlap: {y: 64, x: 64}
blend: {kind: gaussian_mean, sigma_fraction: 0.125}
recon:
  input_channel_names:
  - LS-BF
  time_indices: 0
  reconstruction_dimension: 3
  phase:
    transfer_function:
      wavelength_illumination: 0.530
      yx_pixel_size: 0.069
      z_pixel_size: 0.4
      z_padding: 25
      z_focus_offset: 0
      index_of_refraction_media: 1.4
      numerical_aperture_detection: 1.35
      numerical_aperture_illumination: 0.52
      invert_phase_contrast: false
    apply_inverse:
      reconstruction_algorithm: Tikhonov
      regularization_strength: 0.001
      TV_rho_strength: 0.001
      TV_iterations: 1
