# Verbatim copy of /hpc/projects/comp.micro/infected_cell_imaging/Neurons/2025_07_17_iGluta_EV71/1-reconstruct/FITC.yaml
# EV71-infected iGluta neurons: FITC fluorescence deconvolution 3D.
input_channel_names:
- FITC
time_indices: all
reconstruction_dimension: 3
fluorescence:
  transfer_function:
    yx_pixel_size: 0.325
    z_pixel_size: 1.0
    z_padding: 0
    index_of_refraction_media: 1.0
    numerical_aperture_detection: 0.55
    wavelength_emission: 0.461
  apply_inverse:
    reconstruction_algorithm: Tikhonov
    regularization_strength: 0.005
    TV_rho_strength: 0.001
    TV_iterations: 1
