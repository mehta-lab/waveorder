# Verbatim copy of /hpc/projects/waveorder/a549-hummingbird/2026-02-12-regression-test/configs/phase2d.yml
# a549-hummingbird API-refactor regression test (hummingbird widefield, z_focus_offset -1).
input_channel_names:
  - BF
time_indices: 0
reconstruction_dimension: 2
phase:
  transfer_function:
    wavelength_illumination: 0.532
    yx_pixel_size: 0.325
    z_pixel_size: 1.5
    z_padding: 0
    z_focus_offset: -1
    index_of_refraction_media: 1.0
    numerical_aperture_detection: 0.55
    numerical_aperture_illumination: 0.4
    invert_phase_contrast: false
  apply_inverse:
    reconstruction_algorithm: Tikhonov
    regularization_strength: 0.005
    TV_rho_strength: 0.001
    TV_iterations: 1
