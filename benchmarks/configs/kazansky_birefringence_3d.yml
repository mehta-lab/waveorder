# Verbatim copy of /hpc/projects/waveorder/kazansky-mantis/1-recon/settings/settings-0.yml
# Kazansky polarization target on mantis: joint birefringence + phase 3D from 5 polarization states.
input_channel_names:
- State0
- State1
- State2
- State3
- State4
time_indices: all
reconstruction_dimension: 3
birefringence:
  transfer_function:
    swing: 0.1
  apply_inverse:
    wavelength_illumination: 0.450
    remove_estimated_background: false
    flip_orientation: false
    rotate_orientation: false
phase:
  transfer_function:
    wavelength_illumination: 0.450
    yx_pixel_size: 0.0836
    z_pixel_size: 0.25
    z_padding: 0
    index_of_refraction_media: 1.4
    numerical_aperture_detection: 1.35
    numerical_aperture_illumination: 0.52
    invert_phase_contrast: false
  apply_inverse:
    reconstruction_algorithm: Tikhonov
    regularization_strength: 1.0
    TV_rho_strength: 0.001
    TV_iterations: 50
