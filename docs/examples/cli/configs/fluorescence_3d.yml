input_channel_names:                        # names of input channels in the dataset
- GFP
time_indices: all                           # time points to reconstruct
reconstruction_dimension: 3                 # 2 for thin samples, 3 for thick
fluorescence:
  transfer_function:
    yx_pixel_size: 0.1                      # lateral pixel size in micrometers; scalar for isotropic, or {y, x} mapping for anisotropic
    z_pixel_size: 0.25                      # axial pixel size in micrometers
    z_padding: 0                            # z slices to pad for axial boundary effects
    z_focus_offset: 0                       # (optimizable) offset from center slice in slice units
    index_of_refraction_media: 1.3          # refractive index of imaging media
    numerical_aperture_detection: 1.2       # (optimizable) detection objective numerical aperture
    tilt_angle_zenith: 0.0                  # (optimizable) illumination tilt zenith angle in radians
    tilt_angle_azimuth: 0.0                 # (optimizable) illumination tilt azimuth angle in radians
    wavelength_emission: 0.532              # emission wavelength in micrometers
    confocal_pinhole_diameter: null         # confocal pinhole diameter (null = widefield)
  apply_inverse:
    reconstruction_algorithm: Tikhonov      # 'Tikhonov'/'TV' filters or 'RL'/'RLGC' iterative deconvolution
    regularization_strength: 0.001          # strength of regularization
    TV_rho_strength: 0.001                  # ADMM rho parameter for TV regularization
    TV_iterations: 1                        # ADMM iterations for TV regularization
    rl_iterations: 25                       # maximum RL / RLGC iterations
    rl_background: 0.0                      # constant background folded into the RL / RLGC Poisson forward model
    rl_stopping_tolerance: null             # relative-change early-stop threshold for RL / RLGC (null = run all iterations)
    rl_back_projector: matched              # 'matched' is the matched transpose (classic RL); the unmatched 'gaussian'/'butterworth'/'wiener'/'wiener_butterworth' converge in far fewer iterations but are supported for 'RL' only, not 'RLGC'
    rl_bp_alpha: null                       # Wiener regularization for the 'wiener'/'wiener_butterworth' back projectors (null = matched cutoff gain)
    rl_bp_beta: null                        # cutoff gain for the 'butterworth'/'wiener_butterworth' back projectors (null = matched cutoff gain)
    rl_bp_order: 8                          # Butterworth order for the 'butterworth'/'wiener_butterworth' back projectors
    rl_bp_resolution_mode: fwhm             # cutoff-frequency rule for the back projector ('fwhm_over_sqrt2' suits iSIM)
